      - intranet-network

  tms:
    image: 743737183908.dkr.ecr.ap-south-1.amazonaws.com/paves/tms-dev:latest
    container_name: tms
    env_file:
     - C:\Users\Jagadish.Pannala\UMS\.env.tms
