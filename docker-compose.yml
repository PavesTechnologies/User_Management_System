services:

  ums:
    image: ums-image
    container_name: ums
    env_file:
      - C:/Users/Jagadish.Pannala/UMS/User_Management_System/Backend/.env
    ports:
      - "8000:8000"
    networks:
      - intranet-network

  pms:
    image: ajay1813/pms-image:v1
    container_name: pms
    env_file:
      - C:\Users\Jagadish.Pannala\UMS\.env.pms
